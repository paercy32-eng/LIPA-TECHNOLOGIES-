<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIPA Technologies</title>
    <!-- We are using Tailwind CSS for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">
        <!-- Brand Name -->
        <h1 class="text-3xl font-bold text-center text-green-500 mb-2">LIPA Technologies</h1>
        <p class="text-center text-gray-400 mb-8">Welcome back</p>

        <!-- Form -->
        <form id="authForm" class="space-y-4">
            
            <!-- Phone Number Input -->
            <div>
                <label class="block text-sm font-medium mb-1">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 0712345678" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-green-500">
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-green-500">
            </div>

            <!-- Buttons -->
            <div class="flex flex-col space-y-3 pt-4">
                <button type="button" id="loginBtn" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg transition">
                    Log In
                </button>
                <button type="button" id="registerBtn" 
                    class="w-full bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 rounded-lg transition">
                    Create Account
                </button>
            </div>
        </form>
    </div>

    <!-- Empty script tag where we will add Supabase logic next -->
    <script>
        // We will add the logic here in the next step
    </script>
</body>
</html>
